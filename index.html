<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>YARINOV | Links</title>
        <meta name="description" content="כל הקישורים של YARINOV במקום אחד"/>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .container {
                display: grid;
                grid-template-columns: 200px 1fr;
                gap: 30px;
                max-width: 1200px;
                width: 100%;
                background: white;
                border-radius: 15px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                overflow: hidden;
            }
            .sidebar {
                background: #f8f9fa;
                padding: 30px 20px;
                border-right: 2px solid #e9ecef;
            }
            .sidebar h3 {
                margin-bottom: 20px;
                color: #333;
                font-size: 16px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .sidebar ul {
                list-style: none;
            }
            .sidebar li {
                margin-bottom: 15px;
            }
            .sidebar a {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px;
                color: #667eea;
                text-decoration: none;
                border-radius: 8px;
                transition: all 0.3s ease;
                border: 1px solid transparent;
            }
            .sidebar a:hover {
                background: #e9ecef;
                border-color: #667eea;
                color: #764ba2;
            }
            .link-text {
                flex: 1;
            }
            .check-btn {
                background: #667eea;
                color: white;
                border: none;
                padding: 6px 12px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 12px;
                font-weight: bold;
                transition: all 0.3s ease;
                margin-right: 10px;
            }
            .check-btn:hover {
                background: #764ba2;
                transform: scale(1.05);
            }
            .main-content {
                padding: 40px;
            }
            .main-content h1 {
                color: #333;
                margin-bottom: 30px;
                font-size: 32px;
            }
            .main-content p {
                color: #666;
                line-height: 1.8;
                margin-bottom: 20px;
            }
            @media (max-width: 768px) {
                .container {
                    grid-template-columns: 1fr;
                }
                .sidebar {
                    border-right: none;
                    border-bottom: 2px solid #e9ecef;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="sidebar">
                <h3>קישורים</h3>
                <ul>
                    <li>
                        <a href="https://www.youtube.com/@Yarinov_Clips2009" target="_blank">
                            <span class="link-text">YouTube</span>
                            <button class="check-btn" onclick="window.open(this.parentElement.href)">בדיקה</button>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/yarinov_clips/" target="_blank">
                            <span class="link-text">Instagram</span>
                            <button class="check-btn" onclick="window.open(this.parentElement.href)">בדיקה</button>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.tiktok.com/@yarinov_clips" target="_blank">
                            <span class="link-text">TikTok</span>
                            <button class="check-btn" onclick="window.open(this.parentElement.href)">בדיקה</button>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.twitch.tv/yarinov_clips" target="_blank">
                            <span class="link-text">Twitch</span>
                            <button class="check-btn" onclick="window.open(this.parentElement.href)">בדיקה</button>
                        </a>
                    </li>
                    <li>
                        <a href="https://discord.gg/yarinov" target="_blank">
                            <span class="link-text">Discord</span>
                            <button class="check-btn" onclick="window.open(this.parentElement.href)">בדיקה</button>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="main-content">
                <h1>!ברוכים הבאים ל YARINOV</h1>
                <p>כאן תוכלו למצוא את כל הקישורים שלי במקום אחד.</p>
                <p>בחרו קישור משמאל כדי לבקר בערוצים שלי בכל הפלטפורמות!</p>
                <p>אתם יכולים ללחוץ על כפתור "בדיקה" כדי לבדוק את הקישור.</p>
            </div>
        </div>
    </body>
</html>
